# ----------------------------------------------------
# Projeto: UnDF-TeX
# Arquivo: .github/workflows/build.yml
#
# Integração contínua: compila o modelo em branco e o
# exemplo completo em ambiente limpo (TeX Live atual),
# garantindo que o template permaneça reprodutível.
# ----------------------------------------------------
name: build

on:
  push:
    branches: [main, feature/perfis-tcc]
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Verificar organizacao e links locais da documentacao
        shell: pwsh
        run: ./scripts/verificar-organizacao.ps1

      - name: Conferir evidencias tecnicas do exemplo de Projeto Aplicado
        run: python3 exemplo/projeto-aplicado/artefatos/validar_reserva.py

      - name: Compilar os modelos e verificar os perfis (LuaLaTeX + Biber via latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            tcc.tex
            tcc-exemplo-undf.tex
            artigo.tex
            tcc-artigo.tex
            artigo-exemplo-undf.tex
            tcc-artigo-exemplo-undf.tex
            relatorio-projeto.tex
            relatorio-projeto-aplicado.tex
            relatorio-projeto-aplicado-exemplo-undf.tex
            negocio-tecnologico.tex
            relatorio-projeto-exemplo-undf.tex
            negocio-tecnologico-exemplo-undf.tex
            tests/artigo-opcionais.tex
            tests/artigo-validacao.tex
            tests/perfil-artigo.tex
            tests/perfil-monografia.tex
            tests/complementos-artigo.tex
            tests/complementos-monografia.tex
            tests/apud.tex
            tests/objetos-extensos.tex
            tests/pagina-externa.tex
            tests/inclusao-pdf.tex
          latexmk_use_lualatex: true

      - name: Instalar ferramenta de leitura dos PDFs
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verificar resumo único e elementos opcionais
        shell: pwsh
        run: ./scripts/verificar-artigo.ps1

      - name: Verificar complementos, apud e objetos multipágina
        shell: pwsh
        run: ./scripts/verificar-estrutura.ps1

      - name: Verificar relatorios finais de projeto e negocio tecnologico
        shell: pwsh
        run: ./scripts/verificar-relatorios.ps1

      - name: Publicar PDFs como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            tcc.pdf
            tcc-exemplo-undf.pdf
            artigo.pdf
            tcc-artigo.pdf
            artigo-exemplo-undf.pdf
            tcc-artigo-exemplo-undf.pdf
            relatorio-projeto.pdf
            relatorio-projeto-aplicado.pdf
            relatorio-projeto-aplicado-exemplo-undf.pdf
            negocio-tecnologico.pdf
            relatorio-projeto-exemplo-undf.pdf
            negocio-tecnologico-exemplo-undf.pdf
