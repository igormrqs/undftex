# ----------------------------------------------------
# Projeto: UnDF-TeX
# Arquivo: .github/workflows/build.yml
#
# Integração contínua: compila o modelo em branco e o
# exemplo completo em ambiente limpo (TeX Live atual),
# garantindo que o template permaneça reprodutível.
# ----------------------------------------------------
name: build

on:
  push:
    branches: [main, feature/perfis-tcc]
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Compilar os modelos e verificar os perfis (LuaLaTeX + Biber via latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            tcc.tex
            tcc-exemplo-undf.tex
            artigo.tex
            tcc-artigo.tex
            tests/artigo-opcionais.tex
            tests/artigo-validacao.tex
            tests/perfil-artigo.tex
            tests/perfil-monografia.tex
          latexmk_use_lualatex: true

      - name: Instalar ferramenta de leitura dos PDFs
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verificar resumo único e elementos opcionais
        shell: pwsh
        run: ./scripts/verificar-artigo.ps1

      - name: Publicar PDFs como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            tcc.pdf
            tcc-exemplo-undf.pdf
            artigo.pdf
            tcc-artigo.pdf
