# Regressao integral: mesmo ponto de entrada local e remoto, sem publicacao oficial.
name: build
on:
  push:
    branches: [main, feature/perfis-tcc]
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
      - name: Executar contratos no ambiente TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            apt-get update
            apt-get install -y ca-certificates curl git python3 poppler-utils
            . /etc/os-release
            curl -fsSL "https://packages.microsoft.com/config/debian/$VERSION_ID/packages-microsoft-prod.deb" -o /tmp/undf-msrepo.deb
            dpkg -i /tmp/undf-msrepo.deb
            apt-get update
            apt-get install -y powershell
            workspace="$(pwd -P)"
            test -n "${GITHUB_WORKSPACE:-}"
            test "$workspace" = "$(realpath -- "$GITHUB_WORKSPACE")"
            test -d "$workspace/.git"
            test "${GITHUB_REPOSITORY:-}" = "igormrqs/undftex"
            origin="$(git config --file "$workspace/.git/config" --get remote.origin.url)"
            case "$origin" in
              https://github.com/igormrqs/undftex|https://github.com/igormrqs/undftex.git) ;;
              *) echo "Origem Git inesperada no workspace" >&2; exit 1 ;;
            esac
            printf 'Git no conteiner: usuario=%s uid=%s HOME=%s workspace=%s owner=%s\n' "$(id -un)" "$(id -u)" "${HOME:?}" "$workspace" "$(stat -c '%u:%g' "$workspace")"
            git config --global --add safe.directory "$workspace"
            test "$workspace" = "$(realpath -- "$(git -C "$workspace" rev-parse --show-toplevel)")"
            test "$(git -C "$workspace" rev-parse HEAD)" = "$GITHUB_SHA"
            git -C "$workspace" ls-files > /dev/null
            pwsh -NoProfile -File ./scripts/verificar-ci.ps1
      - name: Preservar resumo e diagnosticos da validacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-ci
          if-no-files-found: error
          path: |
            build/ci/
            build/f04/*.log
            build/f04/*-biber.txt
            build/f04/*-saida.txt
            build/perfis/resumo.json
            build/perfis/resumo-parcial.json
            build/perfis/*-resultados.json
            build/perfis/datamodel-*/resultado.json
            build/perfis/datamodel-*/*.blg
            build/perfis/datamodel-*/validacao.txt
            build/perfis/*.log
            build/perfis/*-biber.txt
            build/controles-ci/*-resultados.json
            build/controles-ci/*.log
            build/controles-ci/*-biber.txt
            manuais/**/build/*-info.txt
            manuais/**/build/*.log
